  <path d="M 460 380 L 510 380" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 510 420 L 460 420" stroke="#34d399" stroke-width="2"/>
  <path d="M 930 380 L 980 380" stroke="#fbbf24" stroke-width="2"/>
