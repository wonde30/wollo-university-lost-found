<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <rect x="40" y="30" width="1360" height="90" rx="12" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="70" font-size="24" font-weight="700" fill="#f8fafc">Wollo University Lost &amp; Found Item Tracking Portal</text>
  <text x="70" y="98" font-size="14" fill="#94a3b8">System Architecture Blueprint • Verified Multi-Tier Operational Architecture (Laravel 11 REST API + React 18 / TypeScript + MySQL 8.0)</text>
  
  <rect x="1220" y="52" width="150" height="34" rx="17" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <circle cx="1238" cy="69" r="5" fill="#34d399"/>
  <text x="1252" y="74" font-size="12" font-weight="600" fill="#ecfdf5">STATUS: OPERATIONAL</text>

  <!-- ================= TIER 1: CLIENT TIER ================= -->
  <rect x="40" y="145" width="420" height="710" rx="14" fill="url(#cardGrad1)" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="145" width="420" height="48" rx="14" fill="#1e3a8a" opacity="0.6"/>
  <text x="65" y="176" font-size="16" font-weight="700" fill="#60a5fa">TIER 1: PRESENTATION &amp; CLIENT APPS</text>
  <text x="360" y="176" font-size="12" font-weight="600" fill="#93c5fd">PORT: 5173</text>

  <!-- Client components -->
  <!-- Public Portal -->
  <rect x="65" y="210" width="370" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="235" font-size="14" font-weight="700" fill="#f1f5f9">Public Visitor &amp; Search Portal</text>
  <text x="80" y="258" font-size="12" fill="#94a3b8">• Unauthenticated item browsing &amp; search</text>
  <text x="80" y="278" font-size="12" fill="#94a3b8">• Reference tracking code verification (/track/:code)</text>

  <!-- Student Portal -->
  <rect x="65" y="315" width="370" height="110" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="340" font-size="14" font-weight="700" fill="#38bdf8">Student Self-Service Portal</text>
  <text x="80" y="363" font-size="12" fill="#94a3b8">• Multi-step Report Lost / Report Found item wizard</text>
  <text x="80" y="383" font-size="12" fill="#94a3b8">• Ownership claim submission with proof &amp; serials</text>
  <text x="80" y="403" font-size="12" fill="#94a3b8">• My Items &amp; Claims tracker with real-time alerts</text>

  <!-- Staff Portal -->
  <rect x="65" y="440" width="370" height="115" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="465" font-size="14" font-weight="700" fill="#a78bfa">Campus Security &amp; Custody Desk</text>
  <text x="80" y="488" font-size="12" fill="#94a3b8">• Physical intake &amp; barcode/reference tagging</text>
  <text x="80" y="508" font-size="12" fill="#94a3b8">• Claim verification workflow (Approve / Reject)</text>
  <text x="80" y="528" font-size="12" fill="#94a3b8">• Item custody transfer &amp; storage bin assignment</text>
  <text x="80" y="548" font-size="12" fill="#94a3b8">• Secure return handover verification with tokens</text>

  <!-- Admin Console -->
  <rect x="65" y="570" width="370" height="115" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="80" y="595" font-size="14" font-weight="700" fill="#f59e0b">Administrative Control Center</text>
  <text x="80" y="618" font-size="12" fill="#94a3b8">• Dynamic RBAC (5 Roles, 22 Permissions matrix)</text>
  <text x="80" y="638" font-size="12" fill="#94a3b8">• Real-time system analytics &amp; KPI dashboards</text>
  <text x="80" y="658" font-size="12" fill="#94a3b8">• Complete forensic audit trail viewer (58 logs)</text>
  <text x="80" y="678" font-size="12" fill="#94a3b8">• Multi-campus storage depot configuration</text>

  <!-- Tech Badges -->
  <rect x="65" y="705" width="370" height="130" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="80" y="730" font-size="12" font-weight="700" fill="#64748b">FRONTEND TECH ARCHITECTURE</text>
  <text x="80" y="755" font-size="12" fill="#e2e8f0">• Framework: <tspan fill="#38bdf8" font-weight="600">React 18</tspan> + <tspan fill="#38bdf8" font-weight="600">TypeScript 5.x</tspan></text>
  <text x="80" y="775" font-size="12" fill="#e2e8f0">• Build Tool: <tspan fill="#f59e0b" font-weight="600">Vite 6.x</tspan> (HMR + Optimized Production)</text>
  <text x="80" y="795" font-size="12" fill="#e2e8f0">• Styling: <tspan fill="#34d399" font-weight="600">Tailwind CSS</tspan> (Responsive WU institutional theme)</text>
  <text x="80" y="815" font-size="12" fill="#e2e8f0">• State/Data: <tspan fill="#f43f5e" font-weight="600">TanStack React Query</tspan> + Axios Interceptors</text>


  <!-- ================= TIER 2: APPLICATION & API TIER ================= -->
  <rect x="510" y="145" width="420" height="710" rx="14" fill="url(#cardGrad1)" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <rect x="510" y="145" width="420" height="48" rx="14" fill="#064e3b" opacity="0.6"/>
  <text x="535" y="176" font-size="16" font-weight="700" fill="#34d399">TIER 2: APPLICATION &amp; BUSINESS LOGIC</text>
  <text x="830" y="176" font-size="12" font-weight="600" fill="#a7f3d0">PORT: 8000</text>

  <!-- Security & Gateway -->
  <rect x="535" y="210" width="370" height="85" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="550" y="235" font-size="14" font-weight="700" fill="#34d399">API Gateway &amp; Perimeter Security</text>
  <text x="550" y="258" font-size="12" fill="#94a3b8">• Laravel Sanctum Bearer Token &amp; Cookie Auth</text>
  <text x="550" y="278" font-size="12" fill="#94a3b8">• Rate Limiting (60 req/min), CORS &amp; CSRF protection</text>

  <!-- Core Services -->
  <rect x="535" y="308" width="370" height="155" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="550" y="333" font-size="14" font-weight="700" fill="#f8fafc">Core Operational Business Services</text>
  <text x="550" y="356" font-size="12" fill="#94a3b8">• ItemService: Automated reference code generation</text>
  <text x="550" y="376" font-size="12" fill="#94a3b8">• ClaimService: Fraud prevention &amp; approval pipeline</text>
  <text x="550" y="396" font-size="12" fill="#94a3b8">• CustodyService: Chain-of-custody event logging</text>
  <text x="550" y="416" font-size="12" fill="#94a3b8">• ReturnService: Cryptographic token generation (SHA-256)</text>
  <text x="550" y="436" font-size="12" fill="#94a3b8">• ReportService: On-demand PDF/CSV report generation</text>

  <!-- Matching Engine -->
  <rect x="535" y="475" width="370" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="550" y="500" font-size="14" font-weight="700" fill="#fbbf24">Deterministic Match Engine</text>
  <text x="550" y="523" font-size="12" fill="#94a3b8">• Category-gated similarity pipeline</text>
  <text x="550" y="543" font-size="12" fill="#94a3b8">• Tokenized title &amp; description Jaccard scoring</text>
  <text x="550" y="563" font-size="12" fill="#94a3b8">• Campus proximity &amp; incident date window matching</text>

  <!-- Events & Real-time -->
  <rect x="535" y="588" width="370" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="550" y="613" font-size="14" font-weight="700" fill="#60a5fa">Real-Time Notification Pipeline</text>
  <text x="550" y="636" font-size="12" fill="#94a3b8">• Server-Sent Events (SSE) live push stream</text>
  <text x="550" y="656" font-size="12" fill="#94a3b8">• Match alerts, claim status updates, handover pings</text>

  <!-- Tech Badges -->
  <rect x="535" y="695" width="370" height="140" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="550" y="720" font-size="12" font-weight="700" fill="#64748b">BACKEND TECH ARCHITECTURE</text>
  <text x="550" y="745" font-size="12" fill="#e2e8f0">• Framework: <tspan fill="#f43f5e" font-weight="600">Laravel 11.x</tspan> on <tspan fill="#f43f5e" font-weight="600">PHP 8.2</tspan></text>
  <text x="550" y="765" font-size="12" fill="#e2e8f0">• Tests: <tspan fill="#34d399" font-weight="600">208 PHPUnit Tests</tspan> (909 assertions, 100% pass)</text>
  <text x="550" y="785" font-size="12" fill="#e2e8f0">• Security: Form Requests, Policy Authorization, Observers</text>
  <text x="550" y="805" font-size="12" fill="#e2e8f0">• Audit Trail: Immutable DB logging on all mutations</text>


  <!-- ================= TIER 3: DATA & STORAGE TIER ================= -->
  <rect x="980" y="145" width="420" height="710" rx="14" fill="url(#cardGrad1)" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <rect x="980" y="145" width="420" height="48" rx="14" fill="#78350f" opacity="0.6"/>
  <text x="1005" y="176" font-size="16" font-weight="700" fill="#fbbf24">TIER 3: DATA &amp; STORAGE ARCHITECTURE</text>
  <text x="1310" y="176" font-size="12" font-weight="600" fill="#fde68a">PORT: 3306</text>

  <!-- Database Schema -->
  <rect x="1005" y="210" width="370" height="150" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="1020" y="235" font-size="14" font-weight="700" fill="#fbbf24">Normalized MySQL 8.0 Engine</text>
  <text x="1020" y="258" font-size="12" fill="#94a3b8">• 44 Normalized Tables with 0 foreign-key orphans</text>
  <text x="1020" y="278" font-size="12" fill="#94a3b8">• Items table: 26 active records (Lost &amp; Found)</text>
  <text x="1020" y="298" font-size="12" fill="#94a3b8">• Claims table: 7 verified records</text>
  <text x="1020" y="318" font-size="12" fill="#94a3b8">• Returns &amp; Documents: 2 cryptographic handover records</text>
  <text x="1020" y="338" font-size="12" fill="#94a3b8">• Audit Logs: 58 immutable forensic records</text>

  <!-- Institutional Metadata -->
  <rect x="1005" y="375" width="370" height="135" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="1020" y="400" font-size="14" font-weight="700" fill="#38bdf8">Institutional Structure (Wollo Univ)</text>
  <text x="1020" y="423" font-size="12" fill="#94a3b8">• 3 Campuses (Dessie, KIoT, Tita)</text>
  <text x="1020" y="443" font-size="12" fill="#94a3b8">• 29 Organizational Units (Colleges, Depts, Security)</text>
  <text x="1020" y="463" font-size="12" fill="#94a3b8">• 11 Standardized Item Categories</text>
  <text x="1020" y="483" font-size="12" fill="#94a3b8">• 9 Secure Storage Depots &amp; Shelves</text>

  <!-- Relational Integrity -->
  <rect x="1005" y="525" width="370" height="150" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="1020" y="550" font-size="14" font-weight="700" fill="#34d399">Relational Integrity &amp; Storage</text>
  <text x="1020" y="573" font-size="12" fill="#94a3b8">• Cascading constraints &amp; soft-delete protections</text>
  <text x="1020" y="593" font-size="12" fill="#94a3b8">• Storage locations with physical bin tracking</text>
  <text x="1020" y="613" font-size="12" fill="#94a3b8">• Item photo attachments with disk storage</text>
  <text x="1020" y="633" font-size="12" fill="#94a3b8">• Item status histories (41 tracked transitions)</text>
  <text x="1020" y="653" font-size="12" fill="#94a3b8">• Search queries &amp; views (1,577 recorded queries)</text>

  <!-- DB Specs -->
  <rect x="1005" y="690" width="370" height="145" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="1020" y="715" font-size="12" font-weight="700" fill="#64748b">STORAGE &amp; INFRASTRUCTURE</text>
  <text x="1020" y="740" font-size="12" fill="#e2e8f0">• RDBMS: <tspan fill="#38bdf8" font-weight="600">MySQL 8.0</tspan> (InnoDB, utf8mb4_unicode_ci)</text>
  <text x="1020" y="760" font-size="12" fill="#e2e8f0">• Database: <tspan fill="#f59e0b" font-weight="600">wollo_lost_found_normalized</tspan></text>
  <text x="1020" y="780" font-size="12" fill="#e2e8f0">• File Storage: Local Private &amp; Public Disks</text>
  <text x="1020" y="800" font-size="12" fill="#e2e8f0">• Sessions &amp; Cache: Database-backed session table</text>

