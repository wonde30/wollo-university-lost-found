name: CI / CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-tests:
    name: Backend Tests (Laravel 13 + PHP 8.3)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wollo_lost_found_test
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, zip, gd, fileinfo
          coverage: none

      - name: Copy .env
        run: cp server/.env.example server/.env

      - name: Install Composer Dependencies
        run: |
          cd server
          composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Generate Application Key
        run: |
          cd server
          php artisan key:generate

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wollo_lost_found_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          cd server
          php artisan migrate --force

      - name: Execute Automated Test Suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: wollo_lost_found_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          cd server
          php artisan test

  frontend-build:
    name: Frontend Build & Type Check (Vue 3 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: |
          cd client
          npm ci

      - name: Type Check (vue-tsc)
        run: |
          cd client
          npm run type-check

      - name: Production Bundle Build
        run: |
          cd client
          npm run build
