<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace, sans-serif;">
  <defs>
    <linearGradient id="erdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="40" y="25" width="1360" height="80" rx="10" fill="url(#erdGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="60" font-size="22" font-weight="700" fill="#f8fafc">Wollo University Lost &amp; Found — Database Schema &amp; Entity-Relationship Diagram</text>
  <text x="70" y="85" font-size="13" fill="#94a3b8">Schema: wollo_lost_found_normalized • Engine: MySQL 8.0 InnoDB • 44 Normalized Tables • Zero FK Orphans Verified</text>
  <rect x="1230" y="45" width="140" height="32" rx="16" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
  <text x="1245" y="66" font-size="12" font-weight="600" fill="#bfdbfe">44 TABLES ACTIVE</text>

  <!-- ENTITY 1: USERS -->
  <rect x="40" y="130" width="280" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="130" width="280" height="36" rx="8" fill="#0369a1"/>
  <text x="55" y="154" font-size="14" font-weight="700" fill="#ffffff">users (25 records)</text>
  <text x="55" y="185" font-size="12" fill="#38bdf8">PK  id : bigint unsigned</text>
  <text x="55" y="205" font-size="12" fill="#e2e8f0">    name : varchar(255)</text>
  <text x="55" y="225" font-size="12" fill="#e2e8f0">    email : varchar(255) [UNIQUE]</text>
  <text x="55" y="245" font-size="12" fill="#e2e8f0">    role : varchar(50) [ENUM]</text>
  <text x="55" y="265" font-size="12" fill="#e2e8f0">    university_id : varchar(100)</text>
  <text x="55" y="285" font-size="12" fill="#e2e8f0">    phone : varchar(50)</text>
  <text x="55" y="305" font-size="12" fill="#94a3b8">    status : varchar(50) [active]</text>
  <text x="55" y="325" font-size="12" fill="#94a3b8">    campus_id : bigint unsigned [FK]</text>
  <text x="55" y="345" font-size="12" fill="#94a3b8">    created_at / updated_at</text>

  <!-- ENTITY 2: ROLES & PERMISSIONS -->
  <rect x="40" y="380" width="280" height="180" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="380" width="280" height="36" rx="8" fill="#4338ca"/>
  <text x="55" y="404" font-size="14" font-weight="700" fill="#ffffff">roles &amp; permissions (5 roles)</text>
  <text x="55" y="435" font-size="12" fill="#818cf8">PK  roles.id : bigint unsigned</text>
  <text x="55" y="455" font-size="12" fill="#e2e8f0">    roles.slug : admin, staff, student...</text>
  <text x="55" y="475" font-size="12" fill="#818cf8">PK  permissions.id : bigint</text>
  <text x="55" y="495" font-size="12" fill="#e2e8f0">    permissions.slug (22 rules)</text>
  <text x="55" y="515" font-size="12" fill="#cbd5e1">pivot: permission_role (60 bindings)</text>
  <text x="55" y="535" font-size="12" fill="#94a3b8">dynamic RBAC matrix verified</text>

  <!-- ENTITY 3: AUDIT LOGS -->
  <rect x="40" y="580" width="280" height="150" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="580" width="280" height="36" rx="8" fill="#be123c"/>
  <text x="55" y="604" font-size="14" font-weight="700" fill="#ffffff">audit_logs (58 records)</text>
  <text x="55" y="635" font-size="12" fill="#f43f5e">PK  id : bigint unsigned</text>
  <text x="55" y="655" font-size="12" fill="#94a3b8">FK  actor_id : bigint unsigned</text>
  <text x="55" y="675" font-size="12" fill="#e2e8f0">    action : login, create, approve...</text>
  <text x="55" y="695" font-size="12" fill="#e2e8f0">    auditable_type &amp; id</text>
  <text x="55" y="715" font-size="12" fill="#94a3b8">    old_values / new_values [JSON]</text>

  <!-- ENTITY 4: ITEMS (CORE) -->
  <rect x="360" y="130" width="340" height="380" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="360" y="130" width="340" height="36" rx="8" fill="#b45309"/>
  <text x="375" y="154" font-size="14" font-weight="700" fill="#ffffff">items (26 records - Lost &amp; Found)</text>
  <text x="375" y="185" font-size="12" fill="#fbbf24">PK  id : bigint unsigned</text>
  <text x="375" y="205" font-size="12" fill="#fef08a">    reference_code : varchar(255) [UNIQUE]</text>
  <text x="375" y="225" font-size="12" fill="#94a3b8">FK  reporter_id : bigint unsigned -> users</text>
  <text x="375" y="245" font-size="12" fill="#94a3b8">FK  campus_id : bigint unsigned -> campuses</text>
  <text x="375" y="265" font-size="12" fill="#94a3b8">FK  category_id : bigint -> categories</text>
  <text x="375" y="285" font-size="12" fill="#94a3b8">FK  location_id : bigint -> locations</text>
  <text x="375" y="305" font-size="12" fill="#e2e8f0">    type : varchar(50) [lost | found]</text>
  <text x="375" y="325" font-size="12" fill="#e2e8f0">    title : varchar(255)</text>
  <text x="375" y="345" font-size="12" fill="#e2e8f0">    description : text</text>
  <text x="375" y="365" font-size="12" fill="#e2e8f0">    brand, color, serial_number</text>
  <text x="375" y="385" font-size="12" fill="#34d399">    status : reported, verified, returned...</text>
  <text x="375" y="405" font-size="12" fill="#e2e8f0">    incident_date &amp; time</text>
  <text x="375" y="425" font-size="12" fill="#e2e8f0">    is_high_value : boolean</text>
  <text x="375" y="445" font-size="12" fill="#e2e8f0">    held_at : varchar(255)</text>
  <text x="375" y="465" font-size="12" fill="#94a3b8">    last_activity_at, expires_at</text>
  <text x="375" y="485" font-size="12" fill="#94a3b8">    created_at / updated_at</text>

  <!-- ENTITY 5: CLAIMS -->
  <rect x="740" y="130" width="310" height="250" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="740" y="130" width="310" height="36" rx="8" fill="#047857"/>
  <text x="755" y="154" font-size="14" font-weight="700" fill="#ffffff">claims (7 records)</text>
  <text x="755" y="185" font-size="12" fill="#34d399">PK  id : bigint unsigned</text>
  <text x="755" y="205" font-size="12" fill="#94a3b8">FK  item_id : bigint unsigned -> items</text>
  <text x="755" y="225" font-size="12" fill="#94a3b8">FK  claimant_id : bigint unsigned -> users</text>
  <text x="755" y="245" font-size="12" fill="#e2e8f0">    explanation : text</text>
  <text x="755" y="265" font-size="12" fill="#34d399">    status : pending, approved, rejected</text>
  <text x="755" y="285" font-size="12" fill="#94a3b8">FK  reviewed_by : bigint -> users</text>
  <text x="755" y="305" font-size="12" fill="#e2e8f0">    review_note : text</text>
  <text x="755" y="325" font-size="12" fill="#e2e8f0">    reviewed_at : timestamp</text>
  <text x="755" y="345" font-size="12" fill="#e2e8f0">    auto_rejected : boolean</text>

  <!-- ENTITY 6: RETURNS -->
  <rect x="740" y="420" width="310" height="260" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="740" y="420" width="310" height="36" rx="8" fill="#0e7490"/>
  <text x="755" y="444" font-size="14" font-weight="700" fill="#ffffff">returns (2 records - Handover)</text>
  <text x="755" y="475" font-size="12" fill="#22d3ee">PK  id : bigint unsigned</text>
  <text x="755" y="495" font-size="12" fill="#94a3b8">FK  claim_id : bigint unsigned [UNIQUE]</text>
  <text x="755" y="515" font-size="12" fill="#94a3b8">FK  returned_to : bigint -> users</text>
  <text x="755" y="535" font-size="12" fill="#94a3b8">FK  handed_over_by : bigint -> users</text>
  <text x="755" y="555" font-size="12" fill="#94a3b8">FK  storage_location_id : bigint</text>
  <text x="755" y="575" font-size="12" fill="#e2e8f0">    return_date &amp; time</text>
  <text x="755" y="595" font-size="12" fill="#22d3ee">    recipient_confirmed : boolean</text>
  <text x="755" y="615" font-size="12" fill="#fef08a">    confirmation_token : varchar(100)</text>
  <text x="755" y="635" font-size="12" fill="#94a3b8">    confirmation_token_expires_at</text>
  <text x="755" y="655" font-size="12" fill="#e2e8f0">    confirmed_at : timestamp</text>

  <!-- ENTITY 7: STORAGE & CUSTODY -->
  <rect x="1090" y="130" width="310" height="260" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1090" y="130" width="310" height="36" rx="8" fill="#7e22ce"/>
  <text x="1105" y="154" font-size="14" font-weight="700" fill="#ffffff">custody_events (24 records)</text>
  <text x="1105" y="185" font-size="12" fill="#c084fc">PK  id : bigint unsigned</text>
  <text x="1105" y="205" font-size="12" fill="#94a3b8">FK  item_id : bigint -> items</text>
  <text x="1105" y="225" font-size="12" fill="#94a3b8">FK  storage_location_id : bigint</text>
  <text x="1105" y="245" font-size="12" fill="#94a3b8">FK  actor_id : bigint -> users</text>
  <text x="1105" y="265" font-size="12" fill="#e2e8f0">    event_type : checkin, transfer, handover</text>
  <text x="1105" y="285" font-size="12" fill="#e2e8f0">    security_seal_number</text>
  <text x="1105" y="305" font-size="12" fill="#e2e8f0">    notes : text</text>
  <text x="1105" y="325" font-size="12" fill="#94a3b8">    created_at / updated_at</text>
  <text x="1105" y="355" font-size="12" fill="#c084fc">Linked: storage_locations (9 depots)</text>

  <!-- ENTITY 8: MATCH SUGGESTIONS & NOTIFICATIONS -->
  <rect x="1090" y="420" width="310" height="260" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1090" y="420" width="310" height="36" rx="8" fill="#a16207"/>
  <text x="1105" y="444" font-size="14" font-weight="700" fill="#ffffff">match_suggestions (9 records)</text>
  <text x="1105" y="475" font-size="12" fill="#facc15">PK  id : bigint unsigned</text>
  <text x="1105" y="495" font-size="12" fill="#94a3b8">FK  lost_item_id : bigint -> items</text>
  <text x="1105" y="515" font-size="12" fill="#94a3b8">FK  found_item_id : bigint -> items</text>
  <text x="1105" y="535" font-size="12" fill="#fde047">    confidence_score : decimal (94.5%)</text>
  <text x="1105" y="555" font-size="12" fill="#e2e8f0">    status : suggested, accepted, dismissed</text>
  <text x="1105" y="575" font-size="12" fill="#e2e8f0">    criteria_breakdown : JSON</text>
  <text x="1105" y="605" font-size="12" fill="#38bdf8">Linked: notifications (87 records)</text>
  <text x="1105" y="625" font-size="12" fill="#94a3b8">FK  user_id : bigint -> users</text>
  <text x="1105" y="645" font-size="12" fill="#e2e8f0">    type, title, data (JSON), read_at</text>

  <!-- Connectors -->
  <line x1="320" y1="200" x2="360" y2="200" stroke="#38bdf8" stroke-width="2"/>
  <line x1="700" y1="200" x2="740" y2="200" stroke="#10b981" stroke-width="2"/>
  <line x1="895" y1="380" x2="895" y2="420" stroke="#06b6d4" stroke-width="2"/>
  <line x1="700" y1="280" x2="1090" y2="280" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="700" y1="360" x2="1090" y2="490" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Footer Stats -->
  <rect x="40" y="755" width="1360" height="95" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="65" y="785" font-size="13" font-weight="700" fill="#94a3b8">DATABASE NORMALIZATION &amp; INTEGRITY SUMMARY</text>
  <text x="65" y="810" font-size="12" fill="#cbd5e1">• Campuses: 3 (Dessie, KIoT, Tita)  |  Colleges/Units: 29  |  Categories: 11  |  Storage Depots: 9  |  Users: 25</text>
  <text x="65" y="830" font-size="12" fill="#cbd5e1">• Foreign Key Integrity: 100% Passed (0 orphaned claims, 0 orphaned items, 0 orphaned returns, 0 orphaned custody events)</text>
</svg>
