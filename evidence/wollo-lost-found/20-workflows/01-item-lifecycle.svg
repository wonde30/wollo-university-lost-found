<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="40" y="25" width="1360" height="80" rx="10" fill="url(#flowGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="60" font-size="22" font-weight="700" fill="#f8fafc">Wollo University Lost &amp; Found — End-to-End Operational Lifecycle Workflow</text>
  <text x="70" y="85" font-size="13" fill="#94a3b8">Complete Item State Progression • Verification • Matching • Custody • Handover • Cryptographic Token Confirmation</text>
  <rect x="1230" y="45" width="140" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <text x="1248" y="66" font-size="12" font-weight="600" fill="#ecfdf5">VERIFIED FLOW</text>

  <!-- STAGE 1: INTAKE & REGISTRATION -->
  <rect x="40" y="140" width="310" height="660" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="140" width="310" height="40" rx="12" fill="#1d4ed8"/>
  <text x="60" y="166" font-size="15" font-weight="700" fill="#ffffff">STAGE 1: INTAKE &amp; REPORTING</text>

  <rect x="60" y="200" width="270" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="75" y="225" font-size="13" font-weight="700" fill="#60a5fa">A. Lost Item Reporting</text>
  <text x="75" y="248" font-size="11" fill="#94a3b8">• Student files report via self-service</text>
  <text x="75" y="268" font-size="11" fill="#94a3b8">• Detailed specs: brand, serial, photos</text>
  <text x="75" y="288" font-size="11" fill="#38bdf8">→ Status: [reported / lost]</text>
  <text x="75" y="308" font-size="11" fill="#fbbf24">→ Code: WU-L00000X assigned</text>

  <rect x="60" y="340" width="270" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="75" y="365" font-size="13" font-weight="700" fill="#a78bfa">B. Found Item Surrender</text>
  <text x="75" y="388" font-size="11" fill="#94a3b8">• Good samaritan surrenders physical item</text>
  <text x="75" y="408" font-size="11" fill="#94a3b8">• Intake at Campus Security Desk</text>
  <text x="75" y="428" font-size="11" fill="#34d399">→ Status: [found_unclaimed]</text>
  <text x="75" y="448" font-size="11" fill="#fbbf24">→ Code: WU-F00000X assigned</text>

  <rect x="60" y="480" width="270" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="75" y="505" font-size="13" font-weight="700" fill="#f59e0b">C. Storage &amp; Custody Logging</text>
  <text x="75" y="528" font-size="11" fill="#94a3b8">• Item assigned to Physical Storage Depot</text>
  <text x="75" y="548" font-size="11" fill="#94a3b8">• Shelf &amp; Bin location recorded (e.g. Bin B-03)</text>
  <text x="75" y="568" font-size="11" fill="#94a3b8">• Security seal number logged in DB</text>
  <text x="75" y="588" font-size="11" fill="#c084fc">→ custody_events entry created</text>
  <text x="75" y="608" font-size="11" fill="#94a3b8">→ Audit log recorded with actor ID</text>

  <rect x="60" y="640" width="270" height="140" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="75" y="665" font-size="12" font-weight="700" fill="#64748b">STAGE 1 VALIDATIONS</text>
  <text x="75" y="690" font-size="11" fill="#cbd5e1">• Unique reference code uniqueness check</text>
  <text x="75" y="710" font-size="11" fill="#cbd5e1">• High-value flag triggers supervisor review</text>
  <text x="75" y="730" font-size="11" fill="#cbd5e1">• Mandatory campus &amp; category associations</text>
  <text x="75" y="750" font-size="11" fill="#cbd5e1">• Photo upload MIME &amp; size validation</text>


  <!-- STAGE 2: MATCHING & CLAIMING -->
  <rect x="390" y="140" width="310" height="660" rx="12" fill="#1e293b" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="390" y="140" width="310" height="40" rx="12" fill="#ca8a04"/>
  <text x="410" y="166" font-size="15" font-weight="700" fill="#ffffff">STAGE 2: MATCHING &amp; CLAIMING</text>

  <rect x="410" y="200" width="270" height="150" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="425" y="225" font-size="13" font-weight="700" fill="#facc15">A. Similarity Match Pipeline</text>
  <text x="425" y="248" font-size="11" fill="#94a3b8">• Background &amp; On-demand Jaccard engine</text>
  <text x="425" y="268" font-size="11" fill="#94a3b8">• Category gate: Must match same category</text>
  <text x="425" y="288" font-size="11" fill="#94a3b8">• Title / description tokenized comparison</text>
  <text x="425" y="308" font-size="11" fill="#94a3b8">• Campus proximity &amp; date window weighting</text>
  <text x="425" y="328" font-size="11" fill="#fde047">→ Match score calculated (e.g. 94.5%)</text>

  <rect x="410" y="370" width="270" height="130" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="425" y="395" font-size="13" font-weight="700" fill="#60a5fa">B. Automated Notifications</text>
  <text x="425" y="418" font-size="11" fill="#94a3b8">• In-app notification dispatched to student</text>
  <text x="425" y="438" font-size="11" fill="#94a3b8">• Staff notification queue populated</text>
  <text x="425" y="458" font-size="11" fill="#94a3b8">• Live SSE event broadcasted to active client</text>
  <text x="425" y="478" font-size="11" fill="#38bdf8">→ notifications table record inserted</text>

  <rect x="410" y="520" width="270" height="130" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="425" y="545" font-size="13" font-weight="700" fill="#34d399">C. Student Claim Submission</text>
  <text x="425" y="568" font-size="11" fill="#94a3b8">• Student reviews found item card</text>
  <text x="425" y="588" font-size="11" fill="#94a3b8">• Provides ownership proof &amp; explanation</text>
  <text x="425" y="608" font-size="11" fill="#94a3b8">• Uploads receipts, photos, or ID cards</text>
  <text x="425" y="628" font-size="11" fill="#34d399">→ Status: claims.status = [pending]</text>

  <rect x="410" y="670" width="270" height="110" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="425" y="695" font-size="12" font-weight="700" fill="#64748b">STAGE 2 POLICIES</text>
  <text x="425" y="720" font-size="11" fill="#cbd5e1">• Duplicate claim prevention per student</text>
  <text x="425" y="740" font-size="11" fill="#cbd5e1">• Auto-rejection of claims on withdrawn items</text>
  <text x="425" y="760" font-size="11" fill="#cbd5e1">• Claimant ownership verification enforced</text>


  <!-- STAGE 3: VERIFICATION & APPROVAL -->
  <rect x="740" y="140" width="310" height="660" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="740" y="140" width="310" height="40" rx="12" fill="#047857"/>
  <text x="760" y="166" font-size="15" font-weight="700" fill="#ffffff">STAGE 3: VERIFICATION &amp; APPROVAL</text>

  <rect x="760" y="200" width="270" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="775" y="225" font-size="13" font-weight="700" fill="#34d399">A. Staff Forensic Review</text>
  <text x="775" y="248" font-size="11" fill="#94a3b8">• Security officer inspects physical item</text>
  <text x="775" y="268" font-size="11" fill="#94a3b8">• Cross-checks serial number / identifiers</text>
  <text x="775" y="288" font-size="11" fill="#94a3b8">• Reviews claimant explanation &amp; evidence</text>
  <text x="775" y="308" font-size="11" fill="#94a3b8">• Adds mandatory review note in system</text>
  <text x="775" y="328" font-size="11" fill="#a7f3d0">→ reviewed_by actor ID recorded</text>

  <rect x="760" y="360" width="270" height="130" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="775" y="385" font-size="13" font-weight="700" fill="#38bdf8">B. Formal Decision Action</text>
  <text x="775" y="408" font-size="11" fill="#94a3b8">• OPTION 1: APPROVE CLAIM</text>
  <text x="775" y="428" font-size="11" fill="#34d399">  → claims.status = [approved]</text>
  <text x="775" y="448" font-size="11" fill="#94a3b8">• OPTION 2: REJECT CLAIM</text>
  <text x="775" y="468" font-size="11" fill="#f43f5e">  → claims.status = [rejected]</text>

  <rect x="760" y="510" width="270" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="775" y="535" font-size="13" font-weight="700" fill="#c084fc">C. Handover Prep &amp; Token Gen</text>
  <text x="775" y="558" font-size="11" fill="#94a3b8">• System generates SHA-256 confirmation token</text>
  <text x="775" y="578" font-size="11" fill="#94a3b8">• Token expiry set (48h validity window)</text>
  <text x="775" y="598" font-size="11" fill="#94a3b8">• Notification sent to student with secure link</text>
  <text x="775" y="618" font-size="11" fill="#fde047">→ returns record created (confirmed=0)</text>
  <text x="775" y="638" font-size="11" fill="#94a3b8">→ Physical item prepared for pickup</text>

  <rect x="760" y="670" width="270" height="110" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="775" y="695" font-size="12" font-weight="700" fill="#64748b">STAGE 3 SECURITY CONTROLS</text>
  <text x="775" y="720" font-size="11" fill="#cbd5e1">• RBAC gated by ClaimPolicy::review</text>
  <text x="775" y="740" font-size="11" fill="#cbd5e1">• Non-reversibility of approved handover</text>
  <text x="775" y="760" font-size="11" fill="#cbd5e1">• Immutable claim_status_histories audit row</text>


  <!-- STAGE 4: RETURN & CRYPTOGRAPHIC HANDOVER -->
  <rect x="1090" y="140" width="310" height="660" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1090" y="140" width="310" height="40" rx="12" fill="#0891b2"/>
  <text x="1105" y="166" font-size="15" font-weight="700" fill="#ffffff">STAGE 4: RETURN &amp; CONFIRMATION</text>

  <rect x="1110" y="200" width="270" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="1125" y="225" font-size="13" font-weight="700" fill="#22d3ee">A. In-Person Handover Desk</text>
  <text x="1125" y="248" font-size="11" fill="#94a3b8">• Student appears at Campus Security Desk</text>
  <text x="1125" y="268" font-size="11" fill="#94a3b8">• Student presents physical University ID</text>
  <text x="1125" y="288" font-size="11" fill="#94a3b8">• Officer inspects item condition &amp; serial</text>
  <text x="1125" y="308" font-size="11" fill="#94a3b8">• Release confirmation signed / submitted</text>
  <text x="1125" y="328" font-size="11" fill="#22d3ee">→ handed_over_by recorded in returns</text>

  <rect x="1110" y="360" width="270" height="140" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="1125" y="385" font-size="13" font-weight="700" fill="#facc15">B. Token Handover Verification</text>
  <text x="1125" y="408" font-size="11" fill="#94a3b8">• Recipient clicks verification link or inputs token</text>
  <text x="1125" y="428" font-size="11" fill="#94a3b8">• Route: /confirm-return/:token</text>
  <text x="1125" y="448" font-size="11" fill="#94a3b8">• Backend verifies token hash &amp; expiration</text>
  <text x="1125" y="468" font-size="11" fill="#34d399">→ returns.recipient_confirmed = 1</text>
  <text x="1125" y="488" font-size="11" fill="#34d399">→ returns.confirmed_at = NOW()</text>

  <rect x="1110" y="520" width="270" height="130" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="1125" y="545" font-size="13" font-weight="700" fill="#34d399">C. Terminal Lifecycle States</text>
  <text x="1125" y="568" font-size="11" fill="#94a3b8">• Item marked permanently returned</text>
  <text x="1125" y="588" font-size="11" fill="#34d399">→ items.status = [returned]</text>
  <text x="1125" y="608" font-size="11" fill="#94a3b8">• Storage depot slot marked available</text>
  <text x="1125" y="628" font-size="11" fill="#94a3b8">• Final audit log emitted &amp; sealed</text>

  <rect x="1110" y="670" width="270" height="110" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="1125" y="695" font-size="12" font-weight="700" fill="#64748b">STAGE 4 COMPLETION</text>
  <text x="1125" y="720" font-size="11" fill="#cbd5e1">• 100% Chain-of-custody completeness</text>
  <text x="1125" y="740" font-size="11" fill="#cbd5e1">• Forensic audit trail verified (BL-01 to BL-06)</text>
  <text x="1125" y="760" font-size="11" fill="#cbd5e1">• Return receipt available for PDF export</text>

  <!-- Connectors between stages -->
  <path d="M 350 400 L 390 400" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 700 400 L 740 400" stroke="#10b981" stroke-width="2"/>
  <path d="M 1050 400 L 1090 400" stroke="#06b6d4" stroke-width="2"/>

  <!-- Footer -->
  <text x="720" y="860" text-anchor="middle" font-size="12" fill="#64748b">Wollo University Lost &amp; Found Item Tracking Portal • Verified Runtime Lifecycle Flow (2026-10-01)</text>
</svg>
